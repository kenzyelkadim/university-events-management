<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create event | University Events</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header"><a class="brand" href="/staff/events.html">University Events</a><nav id="app-nav" aria-label="Main navigation"></nav></header>
  <main id="main" class="page-shell" tabindex="-1">
    <p id="page-message" class="message" hidden></p><p class="eyebrow">Event Team</p><h1 id="form-title">Create an event</h1>
    <form id="event-form" class="panel form-panel">
      <p id="form-message" class="message" hidden></p>
      <p class="hint">Fields marked “required” must be completed.</p>
      <label for="title">Event title (required)</label><input id="title" name="title" maxlength="120" required>
      <label for="description">Description (required)</label><textarea id="description" name="description" rows="4" maxlength="2000" required></textarea>
      <label for="location">Location (required)</label><input id="location" name="location" maxlength="160" required>
      <label for="eventDate">Date (required)</label><input id="eventDate" name="eventDate" type="date" required>
      <label for="category">Category (required)</label><select id="category" name="category" required><option>Academic</option><option>Careers</option><option>Community</option><option>Social</option><option>Sports</option><option>Workshop</option><option>General</option></select>
      <label for="capacity">Capacity (required)</label><input id="capacity" name="capacity" type="number" min="1" max="10000" step="1" required>
      <p class="hint">Event cards use the existing campus photos where available. Students register on a first-come basis.</p>
      <button id="save-event" type="submit">Create event</button> <a href="/staff/events.html">Cancel</a>
    </form>
  </main>
  <footer class="site-footer"><p>University Events</p></footer>
  <script src="/js/common.js"></script><script src="/js/staff-event-form.js"></script>
</body>
</html>
